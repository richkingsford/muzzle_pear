kind = "web"
previewPath = "/"
title = "Chemistry Grid Puzzle"
version = "1.0.0"
id = "artifacts/chem-puzzle"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22279

[services.development]
run = "pnpm --filter @workspace/chem-puzzle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chem-puzzle", "run", "build" ]
publicDir = "artifacts/chem-puzzle/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22279"
BASE_PATH = "/"
